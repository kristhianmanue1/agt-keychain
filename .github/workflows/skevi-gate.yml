name: Llavero verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: llavero-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Skevi structure and provenance
        run: |
          python scripts/check_sizes.py
          python scripts/check_templates.py --manifest .skevi/template-manifest.json --installed .skevi/installed.json
          python scripts/check_templates.py --manifest scripts/MANIFEST.json --installed .skevi/scripts-installed.json
          python scripts/check_templates.py --manifest docs/MANIFEST.json --installed .skevi/corpus-installed.json
      - name: Llavero tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests
      - name: Swift helper syntax
        run: swiftc -typecheck native/llavero_sync.swift
